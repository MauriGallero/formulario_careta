<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet" />
    <title>Contact Form</title>
</head>
<body>
    <h1>Contactanos no seas Careta</h1>
    <p>No Mordemos... la mayoria de veces...</p>
    <hr>
    <div class="form-container">
        <form>
            <h2>Datos: </h2>
            <p style="font-style: italic;">Para venderlos en el mercado negro....</p>
            
            <label for="name">Nombre:</label>
            <input type="text" class="name" id="name" name="name" required />

            <label for="last-name">Apellido:</label>
            <input type="text" id="last-name" class="last-name" name="last-name" required />

            <label for="email">Email:</label>
            <input type="email" class="email" id="email" name="email" required />

            <hr>

            <label for="message">Mensaje:</label>
            <textarea id="message" name="message" required placeholder="Dejate un mensaje no seas Puto..."></textarea>

            <hr>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
